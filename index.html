<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC Gaming</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#top" id="siteName"></a>
    <nav>
      <a href="#games">Games</a>
      <a href="#news">News</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1 id="heroTitle"></h1>
      <p id="heroText"></p>
      <a class="button" href="#games" id="heroButton"></a>
    </section>

    <section id="games">
      <h2 id="gamesTitle"></h2>
      <ul class="game-list" id="gameList"></ul>
    </section>

    <section id="news">
      <h2 id="newsTitle"></h2>
      <div id="newsList"></div>
    </section>

    <section id="contact">
      <h2 id="contactTitle"></h2>
      <p id="contactText"></p>
      <a class="button" id="emailButton" href="#">Email us</a>
    </section>
  </main>

  <footer><p id="footerText"></p></footer>

  <script src="js/main.js"></script>
</body>
</html>
